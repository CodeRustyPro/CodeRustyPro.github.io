<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · Dev Shah</title>
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2213%22 font-size=%2214%22>↹</text></svg>">
<style>
  :root{--bg:#0b0c0e;--fg:#d7dae0;--dim:#7c8290;--accent:#58d6b8}
  @media (prefers-color-scheme:light){:root{--bg:#f7f8fa;--fg:#1b1e24;--dim:#5b616c;--accent:#0a8f74}}
  *{margin:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--fg);font:15px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
       min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
  main{max-width:48ch}
  h1{font-size:1.1rem;font-weight:600}
  .caret{color:var(--accent)}
  p{color:var(--dim);margin:.6rem 0 1rem}
  a{color:var(--fg);text-underline-offset:3px;text-decoration-color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1><span class="caret">&gt;</span> 404 — no route to that path</h1>
  <p>XDP_DROP. The packet was fine; the destination wasn't.</p>
  <p><a href="/">back to one round trip</a></p>
</main>
</body>
</html>
